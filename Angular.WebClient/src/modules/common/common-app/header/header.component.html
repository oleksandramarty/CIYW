<mat-toolbar color="primary" class="app-header">
    <!-- Title on the left -->
    <div class="header-logo-container">
        <button class="menu-button-container toggle-menu-button" *ngIf="(isAuthorized$ | async)"
                mat-menu-item (click)="toggleMenu()">
            <i class="fa-solid fa-bars"></i>
        </button>
        <span class="app-title" (click)="goto('dashboard')">CIYW</span>
    </div>

    <nav class="header-center" *ngIf="!!isAuthorized$ && (isAuthorized$ | async) && currentUser">
        <a *ngIf="(isAdminAreaAvailable$ | async)"
                mat-button
                (click)="isUserMenu = !isUserMenu">
            <i class="fa-solid fa-bolt"></i>
            {{ (isUserMenu ? 'MENU.USER' : 'MENU.ADMIN') | translation}}
            {{ 'USER.MENU' | translation}}
            <i class="fa-solid fa-bolt"></i></a>

        <ng-container *ngIf="isUserMenu">
            <a
                    *ngFor="let item of menuItems; let i=index"
                    mat-button
                    (click)="goto(item.url)"
                    [translation]="item.title"></a>
        </ng-container>
        <ng-container *ngIf="!isUserMenu && (isAdminAreaAvailable$ | async)">
            <a
                    *ngFor="let item of menuAdminItems; let i=index"
                    mat-button
                    (click)="goto(item.url)"
                    [translation]="item.title"></a>
        </ng-container>
    </nav>

    <div class="header-right">
        <ng-container *ngIf="currentLocale">
            <div class="user-info pointer" [matMenuTriggerFor]="menuLang">
                <span class="lang-icon-current">{{ langFlags.get(currentLocale.isoCode) }}</span>
            </div>
            <mat-menu #menuLang="matMenu" class="custom-menu-header-position">
                <ng-container *ngFor="let locale of locales; let i=index">
                    <button mat-menu-item (click)="localeChanged(locale.isoCode)">
                        <div class="lang-menu-item">
            <span class="lang-icon">
            {{ langFlags.get(locale.isoCode) }}
          </span>
                            {{ locale.title }}
                        </div>
                    </button>
                </ng-container>
            </mat-menu>
        </ng-container>
        <ng-container *ngIf="(isAuthorized$ | async) && currentUser">
            <div class="user-info pointer" [matMenuTriggerFor]="menu">
                <div class="avatar-placeholder">
                    {{ currentUser.login.charAt(0).toUpperCase() }}
                </div>
                <span class="user-full-name">{{ currentUser.login }}</span>
            </div>
            <mat-menu #menu="matMenu" class="custom-menu-header-position">
                <button *ngIf="(isAdminAreaAvailable$ | async)" mat-menu-item (click)="goto('admin/home')">
                    <i class="fa-solid fa-screwdriver-wrench mr-0-5rem"></i>
                    <span translation="ADMIN.ADMIN_AREA"></span>
                </button>
                <button mat-menu-item (click)="goto('users/notifications')">
                    <i class="fa-solid fa-bell mr-0-5rem"></i>
                    <span translation="USER.MENU.NOTIFICATIONS"></span>
                </button>
                <button mat-menu-item (click)="goto('users/settings')">
                    <i class="fa-solid fa-gears mr-0-5rem"></i>
                    <span translation="USER.MENU.SETTINGS"></span>
                </button>
                <button mat-menu-item (click)="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-0-5rem"></i>
                    <span translation="USER.MENU.LOGOUT"></span>
                </button>
            </mat-menu>
        </ng-container>
    </div>
</mat-toolbar>
